<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rowspan ,colspan</title>
    <style>
        table {
            border: 1px solid black;
            width: 400px;
            height: 300px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <td colspan="3">Student</td>
                <td> Room no.</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>ID</td>
                <td>Name</td>
                <td>Batch</td>
                <td rowspan="3">602</td>
            </tr>
            <tr>
                <td>101</td>
                <td>hamidul</td>
                <td>19</td>
            </tr>
            <tr>
                <td>102</td>
                <td>mufassir</td>
                <td>19</td>
            </tr>
        </tbody>
    </table>
</body>

</html>

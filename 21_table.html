<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        body{
            background-color: rgb(214, 160, 160);
        }
        table{
            border:1px solid black;
            height: 300px;
            width: 400px;
            border-spacing: 20px;
         /*   border-collapse: collapse;*/
        }
        td,th{
            text-align: center;
            border:1px solid black;
            padding: 50px;
        }
    </style>
        
    
</head>
<body>
    <table>
        <caption style="font-size: 40px;">Student info</caption>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Dept</th>
                <th>Batch</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Hamidul</td>
                <td>CSE</td>
                <td>19</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Mufassir</td>
                <td>CSE</td>
                <td>19</td>
            </tr>
            <tr>
                <td>103</td>
                <td>sohan</td>
                <td>CSE</td>
                <td>19</td>
            </tr>
        </tbody>
    </table>
</body>
</html>

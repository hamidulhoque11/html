<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>accesible table</title>
</head>
<body>
    <header>
        <h1>Customer Table</h1>
    </header>
    <main>
        <table>
            <caption>
                Customers
            </caption>
            <colgroup>
                <col span="2" style="background-color: aquamarine;"/>
            </colgroup>
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td scope="row">101</td>
                    <td>hamidul</td>
                    <td>1000 tk</td>
                </tr>
                <tr>
                    <td scope="row">102</td>
                    <td>sohan</td>
                    <td>2000tk</td>
                </tr>
                <tr>
                    <td scope="row">103</td>
                    <td>asif</td>
                    <td>50000 tk</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
